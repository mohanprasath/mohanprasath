  
name: Update stats

on:
  workflow_dispatch:
  schedule:
    # Runs at 12am UTC
    - cron: '0 * * * *'
  push:
    branches: 
      - master     

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@8539bedb8277066fc9fe1b47d1f9b108eb866494 # v0.3.1
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          USERNAME: mohanprasath
          SHOW_TITLE: true
